<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- خلفية متدرجة تماثل ألوان التطبيق -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <!-- تدرج رمز العملة والأسهم -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- خلفية مربعة بحواف منحنية مناسبة لـ iOS و Android -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- رسم المحفظة / الخزنة -->
  <path d="M120 160 C120 137.9 137.9 120 160 120 L352 120 C374.1 120 392 137.9 392 160 L392 352 C392 374.1 374.1 392 352 392 L160 392 C137.9 392 120 374.1 120 352 Z" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  
  <!-- رمز السداد والأسهم المتبادلة (الذمم والديون) -->
  <path d="M210 210 L302 210 M272 180 L302 210 L272 240" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M302 302 L210 302 M240 272 L210 302 L240 332" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- قفل الأمان الصغير -->
  <circle cx="256" cy="256" r="28" fill="#ffffff"/>
</svg>
